{ id:'BM14', year:'2022', q:'Statement I: All naturally occurring alpha-amino acids except glycine are optically active. Statement II: Most naturally occurring amino acids have D-configuration.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:2, sol:'Statement I is true. Statement II is false because naturally occurring alpha-amino acids mostly belong to the L-series (L-configuration), not D.' },
{ id:'BM15', year:'2021', q:'The structural difference between amylose and amylopectin is:', opts:['Amylose is a branched polymer while amylopectin is linear','Amylose is linear with alpha(1->4) links, amylopectin is branched with alpha(1->4) and alpha(1->6) links','Amylose contains beta-links, amylopectin contains alpha-links','None of the above'], ans:1, sol:'Amylose is a linear polymer of alpha-D-glucose linked by C1-C4 glycosidic bonds. Amylopectin is branched, with C1-C4 forming the chain and C1-C6 forming branches.' },
{ id:'BM16', year:'NEET Mock', q:'Oxidation of glucose with Bromine water yields:', opts:['Saccharic acid','Gluconic acid','Glucuronic acid','Sorbitol'], ans:1, sol:'Bromine water is a mild oxidizing agent. It oxidizes only the aldehyde group of glucose to a carboxyl group, forming gluconic acid. This proves the presence of an aldehyde group.' },
{ id:'BM17', year:'2020', q:'The correct corresponding order of names of four aldopentoses with the same molecular formula is based on:', opts:['Number of carbon atoms','Position of double bonds','Spatial arrangement of -OH groups (Epimers)','Molecular weight'], ans:2, sol:'Stereoisomers of sugars that differ in configuration at a single chiral center are called epimers (spatial arrangement of -OH groups).' },
{ id:'BM18', year:'2019', q:'In DNA, the complementary base pairings are:', opts:['A with C, and G with T','A with T, and G with C','A with G, and C with T','A with U, and G with C'], ans:1, sol:'According to Watson and Crick\'s model and Chargaff\'s rule, Adenine pairs with Thymine (2 H-bonds) and Guanine pairs with Cytosine (3 H-bonds).' },
{ id:'BM19', year:'2023', q:'Which statement about enzymes is incorrect?', opts:['They are highly specific in nature','They lower the activation energy of a reaction','Almost all enzymes are globular proteins','They are effective at any pH and temperature'], ans:3, sol:'Enzymes are biocatalysts that are highly sensitive to temperature and pH. They show maximum activity at an optimum temperature and optimum pH.' },
{ id:'BM20', year:'2022', q:'Which of the following vitamins is water-soluble and must be supplied regularly in the diet?', opts:['Vitamin A','Vitamin D','Vitamin C','Vitamin E'], ans:2, sol:'B group vitamins and Vitamin C are water-soluble. They cannot be stored in the body (except B12) and are excreted in urine, hence needed regularly.' },
{ id:'BM21', year:'2021', q:'A nucleotide consists of:', opts:['Base + Sugar','Base + Phosphate','Base + Sugar + Phosphate','Sugar + Phosphate'], ans:2, sol:'A nucleoside consists of a nitrogenous base and a pentose sugar. When a phosphate group is attached to the nucleoside, it becomes a nucleotide.' },
{ id:'BM22', year:'NEET Mock', q:'The disease \'scurvy\' is caused by the deficiency of:', opts:['Ascorbic acid','Retinol','Calciferol','Thiamine'], ans:0, sol:'Scurvy (bleeding gums) is caused by the deficiency of Vitamin C, which is chemically known as Ascorbic acid.' },
{ id:'BM23', year:'2020', q:'Which of the following is an essential amino acid?', opts:['Alanine','Aspartic acid','Valine','Serine'], ans:2, sol:'Essential amino acids cannot be synthesized by the human body and must be obtained from the diet. Valine, Leucine, Isoleucine, etc., are essential.' },
{ id:'BM24', year:'2019', q:'Complete hydrolysis of cellulose yields:', opts:['D-Fructose','D-Ribose','D-Glucose','L-Glucose'], ans:2, sol:'Cellulose is a straight-chain polysaccharide composed only of beta-D-glucose units. Complete hydrolysis yields only D-glucose.' },
{ id:'BM25', year:'2023', q:'At its isoelectric point, a protein has:', opts:['Maximum solubility','Minimum net charge (zero)','Maximum viscosity','Highest reactivity'], ans:1, sol:'At the isoelectric point, the zwitterion form dominates, meaning the net electrical charge on the amino acid/protein is zero. It does not migrate under an electric field.' },
{ id:'BM26', year:'2022', q:'The pentose sugar present in RNA is:', opts:['D-Deoxyribose','D-Ribose','D-Fructose','D-Arabinose'], ans:1, sol:'RNA contains beta-D-ribose sugar, whereas DNA contains beta-D-2-deoxyribose (which lacks an oxygen atom at the 2\' carbon compared to ribose).' },
{ id:'BM27', year:'2021', q:'Assertion (A): Vitamin D cannot be stored in our body. Reason (R): Vitamin D is a fat-soluble vitamin and is excreted out of the body in urine.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','Both A and R are false'], ans:3, sol:'Both statements are false. Vitamin D is fat-soluble, so it CAN be stored in the body (in liver and adipose tissues), and it is NOT excreted in urine.' },
{ id:'BM28', year:'NEET Mock', q:'Which enzyme converts glucose into ethanol and carbon dioxide?', opts:['Invertase','Diastase','Maltase','Zymase'], ans:3, sol:'Zymase, an enzyme complex found in yeast, catalyzes the fermentation of sugar (glucose/fructose) into ethanol and carbon dioxide.' },
{ id:'BM29', year:'2020', q:'Which of the following terms refers to the spatial arrangement of two different monosaccharides differing at only one specific asymmetric carbon?', opts:['Enantiomers','Epimers','Anomers','Isotopes'], ans:1, sol:'Epimers are diastereomers that differ in configuration at only one chiral center. For example, D-glucose and D-galactose are C-4 epimers.' },
{ id:'BM30', year:'2019', q:'The structural feature that gives a protein its specific biological function is mainly its:', opts:['Primary structure','Secondary structure','Tertiary structure','Monomeric unit'], ans:2, sol:'The tertiary structure represents the overall folding of the polypeptide chain into a specific 3D shape, which is directly responsible for its biological activity and function.' },
{ id:'BM31', year:'2023', q:'Aqueous solution of carbohydrate with 2 drops of alcoholic solution of alpha-naphthol and conc. H₂SO₄ gives a violet ring. This test is known as:', opts:['Molisch test','Fehling test','Tollens test','Biuret test'], ans:0, sol:'Molisch test is a general test for carbohydrates. Alpha-naphthol and conc. H2SO4 react with carbohydrates to form a purple/violet ring at the junction.' },
{ id:'BM32', year:'2022', q:'The metal ion present in Vitamin B12 is:', opts:['Iron','Cobalt','Magnesium','Zinc'], ans:1, sol:'Vitamin B12 is also called Cyanocobalamin, and it contains Cobalt as the central metal ion.' },
{ id:'BM33', year:'2021', q:'Which of the following is an example of an aldohexose?', opts:['Fructose','Ribose','Glucose','Erythrose'], ans:2, sol:'Glucose is an aldohexose (contains an aldehyde group and 6 carbons). Fructose is a ketohexose. Ribose is an aldopentose.' },
{ id:'BM34', year:'NEET Mock', q:'Which carbon atoms are involved in the glycosidic linkage of maltose?', opts:['C1 of alpha-D-glucose and C4 of alpha-D-glucose','C1 of alpha-D-glucose and C2 of beta-D-fructose','C1 of beta-D-galactose and C4 of beta-D-glucose','C1 of alpha-D-glucose and C6 of alpha-D-glucose'], ans:0, sol:'Maltose is a disaccharide composed of two alpha-D-glucose units connected by an alpha-1,4-glycosidic linkage.' },
{ id:'BM35', year:'2020', q:'Proteins that act as biological catalysts are called:', opts:['Hormones','Enzymes','Vitamins','Antibodies'], ans:1, sol:'Enzymes are specialized biological catalysts, almost all of which are globular proteins, that speed up biochemical reactions in living organisms.' },
{ id:'BM36', year:'2019', q:'Which of the following statements about RNA is incorrect?', opts:['It has a single-stranded helix structure','It contains the base uracil instead of thymine','It controls the synthesis of proteins','It is the genetic material in all eukaryotic cells'], ans:3, sol:'DNA is the primary genetic material in eukaryotic cells, while RNA primarily functions in protein synthesis (transcription and translation). Some viruses have RNA as genetic material.' },
{ id:'BM37', year:'2023', q:'The reaction of glucose with hydroxylamine (NH₂OH) produces:', opts:['Glucose cyanohydrin','Gluconic acid','Glucose oxime','Saccharic acid'], ans:2, sol:'Glucose reacts with hydroxylamine to form an oxime. This reaction confirms the presence of a carbonyl group (>C=O) in glucose.' },
{ id:'BM38', year:'2022', q:'Animal starch is the common name for:', opts:['Cellulose','Amylopectin','Glycogen','Inulin'], ans:2, sol:'Glycogen is structurally similar to amylopectin but more highly branched. It is the storage form of carbohydrates in animals, hence called animal starch.' },
{ id:'BM39', year:'2021', q:'Assertion (A): All naturally occurring monosaccharides are optically active. Reason (R): They all contain one or more chiral carbon atoms.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'Every naturally occurring monosaccharide (like glyceraldehyde, glucose, etc.) has at least one chiral center, making them optically active.' },
{ id:'BM40', year:'NEET Mock', q:'Which of the following bonds is NOT involved in stabilizing the tertiary structure of proteins?', opts:['Hydrogen bonds','Disulphide linkages','Phosphodiester bonds','Van der Waals forces'], ans:2, sol:'Phosphodiester bonds are found in nucleic acids (DNA/RNA) connecting nucleotides. Protein tertiary structure is stabilized by H-bonds, disulphide bonds, ionic bonds, and hydrophobic interactions.' },
{ id:'BM41', year:'2020', q:'The correct name for the bond linking amino acids in a polypeptide chain is:', opts:['Amide bond','Ester bond','Ether bond','Glycosidic bond'], ans:0, sol:'A peptide bond is chemically an amide bond (-CONH-) formed between the carboxyl group of one amino acid and the amino group of another with the loss of water.' },
{ id:'BM42', year:'2019', q:'Heating of DNA disrupts its double helix structure. This process is called:', opts:['Renaturation','Denaturation','Replication','Transcription'], ans:1, sol:'Heating DNA causes the hydrogen bonds between base pairs to break, leading to the unwinding and separation of the two strands. This is called denaturation or melting of DNA.' },
{ id:'BM43', year:'2023', q:'Which class of carbohydrates cannot be further hydrolyzed to give simpler units of polyhydroxy aldehyde or ketone?', opts:['Oligosaccharides','Polysaccharides','Disaccharides','Monosaccharides'], ans:3, sol:'Monosaccharides (like glucose, fructose, ribose) are the simplest carbohydrates and cannot be hydrolyzed into smaller carbohydrate molecules.' },
{ id:'BM44', year:'2022', q:'Coagulation of blood requires which of the following vitamins?', opts:['Vitamin A','Vitamin C','Vitamin K','Vitamin E'], ans:2, sol:'Vitamin K is a fat-soluble vitamin that is essential for the synthesis of prothrombin and other clotting factors, thus playing a key role in blood coagulation.' },
{ id:'BM45', year:'2021', q:'Match the hormone with its function: (I) Insulin (II) Thyroxine (III) Adrenaline -> (P) Prepares body for emergency (Q) Controls metabolism (R) Regulates blood sugar', opts:['I-R, II-Q, III-P','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-P, III-Q'], ans:0, sol:'Insulin regulates blood glucose levels. Thyroxine controls general metabolism. Adrenaline (epinephrine) is the "fight or flight" hormone that prepares the body for emergencies.' }
],

};
            
            let collectedAll = [];
            const subjects = ['Physics', 'Chemistry', 'Botany', 'Zoology'];
            for (let sub of subjects) {
                const key = sub.toLowerCase();
                const qList = questions[key] || [];
                const mapped = qList.map(q => ({
                    sub: sub,
                    q: q.q,
                    opts: q.opts,
                    ans: q.ans !== undefined ? q.ans : -1,
                    exp: q.sol || "No detailed explanation provided for this question."
                }));
                collectedAll = collectedAll.concat(mapped);
            }
            
            QUESTIONS = collectedAll;
            status = new Array(QUESTIONS.length).fill('not-visited');
            answers = new Array(QUESTIONS.length).fill(null);
            examView.innerHTML = origHtml;
            
            renderPalette();
            loadQuestion(0);
            startTimer();
        } catch(e) {
            examView.innerHTML = '<div style="text-align:center; padding:40px; color:red;">Failed to load PYQ data.</div>';
            console.error(e);
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitExam();
                return;
            }
            timeLeft--;
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            document.getElementById('timerText').textContent = `${h > 0 ? h + ':' : ''}${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            if (timeLeft < 600) document.getElementById('timerText').style.color = '#ef4444';
        }, 1000);
    }

    function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';
        QUESTIONS.forEach((q, i) => {
            const btn = document.createElement('div');
            btn.className = `p-btn ${status[i]} ${i === currentIdx ? 'active' : ''}`;
            btn.textContent = (i + 1).toString();
            btn.id = `palBtn-${i}`;
            btn.onclick = () => loadQuestion(i);
            grid.appendChild(btn);
        });
        scrollPaletteToActive();
        updateProgressBar();
    }

    function scrollPaletteToActive() {
        const activeBtn = document.getElementById(`palBtn-${currentIdx}`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function updateProgressBar() {
        const ans = status.filter(s => s === 'answered' || s === 'marked-answered').length;
        const mark = status.filter(s => s === 'marked' || s === 'marked-answered').length;
        const total = QUESTIONS.length;
        const perc = (ans / total) * 100;
        document.getElementById('progressBar').style.width = perc + '%';
        document.getElementById('progressText').innerHTML = `<span>ANS: <b>${ans}</b></span> <span>MARKED: <b>${mark}</b></span> <span>TOTAL: <b>${total}</b></span>`;
    }

    function jumpToSubject(sub) {
        const idx = QUESTIONS.findIndex(q => q.sub === sub);
        if (idx !== -1) loadQuestion(idx);
    }

    function updateTabs() {
        const sub = QUESTIONS[currentIdx].sub;
        document.querySelectorAll('.s-tab').forEach(tab => {
            tab.classList.toggle('active', tab.textContent === sub);
        });
    }

    function loadQuestion(idx) {
        if (status[currentIdx] === 'not-visited') status[currentIdx] = 'not-answered';
        currentIdx = idx;
        const q = QUESTIONS[idx];
        
        document.getElementById('qSubject').textContent = q.sub;
        document.getElementById('qCounter').textContent = `Question ${idx + 1}/${QUESTIONS.length}`;
        document.getElementById('qText').innerHTML = q.q;
        document.querySelector('.q-section').scrollTop = 0;

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        const letters = ['A','B','C','D'];
        
        q.opts.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = `opt-btn ${userAnswers[idx] === i ? 'selected' : ''}`;
            btn.innerHTML = `<div class="opt-letter">${letters[i]}</div> <span>${opt}</span>`;
            btn.onclick = () => selectOption(i);
            grid.appendChild(btn);
        });

        if (idx === QUESTIONS.length - 1) {
            document.getElementById('btnSubmit').style.display = 'block';
        }

        updateTabs();
        renderPalette();
    }

    function selectOption(optIdx) {
        userAnswers[currentIdx] = optIdx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((b, i) => b.classList.toggle('selected', i === optIdx));
        
        // Auto update status if marked, keep marked-answered
        if (status[currentIdx] === 'marked' || status[currentIdx] === 'marked-answered') {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'answered';
        }
        renderPalette();
    }

    function handleClear() {
        userAnswers[currentIdx] = null;
        // If it was marked-answered, revert to marked. Otherwise not-answered.
        status[currentIdx] = (status[currentIdx] === 'marked-answered') ? 'marked' : 'not-answered';
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.classList.remove('selected'));
        renderPalette();
    }

    function handleMark() {
        if (userAnswers[currentIdx] !== null) {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'marked';
        }
        renderPalette();
        if (currentIdx < QUESTIONS.length - 1) loadQuestion(currentIdx + 1);
    }

    function handleNext() {
        if (userAnswers[currentIdx] === null && status[currentIdx] !== 'marked' && status[currentIdx] !== 'marked-answered') {
            status[currentIdx] = 'not-answered';
        }
        if (currentIdx < QUESTIONS.length - 1) {
            loadQuestion(currentIdx + 1);
        } else {
            confirmSubmit();
        }
    }

    function confirmSubmit() {
        if (confirm("Are you sure you want to submit the exam?")) {
            submitExam();
        }
    }

    function submitExam() {
        clearInterval(timerInterval);
        document.getElementById('examView').classList.add('hidden');
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('resultView').style.display = 'block';
        renderResults();
    }

    function renderResults(filter = 'all') {
        const container = document.getElementById('reviewContainer');
        container.innerHTML = `<h3 style="margin: 20px 4px 12px; font-weight: 800; font-size: 18px;">Detailed Review</h3>
            <div class="sub-tabs" style="margin-bottom:20px">
                <div class="s-tab ${filter === 'all' ? 'active' : ''}" onclick="renderResults('all')">All</div>
                <div class="s-tab ${filter === 'wrong' ? 'active' : ''}" onclick="renderResults('wrong')">Incorrect</div>
                <div class="s-tab ${filter === 'correct' ? 'active' : ''}" onclick="renderResults('correct')">Correct</div>
                <div class="s-tab ${filter === 'skipped' ? 'active' : ''}" onclick="renderResults('skipped')">Skipped</div>
            </div>`;

        let correct = 0;
        let wrong = 0;
        let skipped = 0;

        QUESTIONS.forEach((q, i) => {
            if (userAnswers[i] === null) skipped++;
            else if (userAnswers[i] === q.ans) correct++;
            else wrong++;
        });

        const score = (correct * 4) - (wrong * 1);
        document.getElementById('resScore').textContent = score;
        document.getElementById('resCorrect').textContent = correct;
        document.getElementById('resWrong').textContent = wrong;
        document.getElementById('resSkipped').textContent = skipped;

        QUESTIONS.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.ans;
            const isSkipped = userAnswers[i] === null;
            
            if (filter === 'wrong' && (isCorrect || isSkipped)) return;
            if (filter === 'correct' && (!isCorrect || isSkipped)) return;
            if (filter === 'skipped' && !isSkipped) return;

            const item = document.createElement('div');
            item.className = 'rev-item';
            
            let userAnsText = isSkipped ? 'Not Answered' : q.opts[userAnswers[i]];
            let statusColor = isCorrect ? 'correct' : (isSkipped ? '' : 'wrong');
            
            item.innerHTML = `
                <div class="rev-q"><span style="color:var(--text-sub)">#${i+1}</span> ${q.q}</div>
                <div class="rev-ans ${statusColor}">
                    <b>Your Answer:</b> ${userAnsText} ${isCorrect ? '✓' : ''}
                </div>
                ${!isCorrect ? `
                <div class="rev-ans correct">
                    <b>Correct Answer:</b> ${q.opts[q.ans]}
                </div>` : ''}
                <div class="rev-exp">
                    <b>Explanation:</b> ${q.exp}
                </div>
            `;
            container.appendChild(item);
        });
    }

    function handleExit() {
        if (confirm("Do you want to exit the mock test? Your progress will be lost.")) {
            window.history.back();
        }
    }

    init();
</script>

</body>
</html>
