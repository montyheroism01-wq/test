{ id:'CHM8', year:'2022', q:'The IUPAC name of the compound CH3-CH(OH)-CH2-C(=O)-CH3 is:', opts:['4-Hydroxypentan-2-one','2-Hydroxypentan-4-one','4-Oxopentan-2-ol','2-Oxopentan-4-ol'], ans:0, sol:'The ketone group gets higher priority over the hydroxyl group for numbering. Numbering starts from the right: carbon-2 has the ketone, carbon-4 has the OH group. Name: 4-Hydroxypentan-2-one.' },
{ id:'CHM9', year:'2021', q:'Which of the following elements shows the maximum oxidation state in the 3d transition series?', opts:['Chromium (Cr)','Iron (Fe)','Manganese (Mn)','Vanadium (V)'], ans:2, sol:'Manganese (Mn) has the electronic configuration 3d⁵ 4s². It can lose all 7 valence electrons to exhibit a maximum oxidation state of +7 (e.g., in KMnO4).' },
{ id:'CHM10', year:'2020', q:'Assertion (A): Boiling point of H2O is much higher than that of H2S. Reason (R): Oxygen is more electronegative than Sulfur, leading to strong intermolecular hydrogen bonding in water.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'Water molecules associate via strong intermolecular hydrogen bonds due to the high electronegativity of oxygen. H2S lacks hydrogen bonding, hence it is a gas at room temperature while H2O is a liquid.' },
{ id:'CHM11', year:'NEET Mock', q:'Match the Name Reaction with its Reagent: (I) Clemmensen reduction (II) Wolff-Kishner reduction (III) Rosenmund reduction -> (P) H2 / Pd-BaSO4 (Q) Zn-Hg / HCl (R) NH2NH2 / KOH', opts:['I-Q, II-R, III-P','I-P, II-Q, III-R','I-R, II-P, III-Q','I-Q, II-P, III-R'], ans:0, sol:'Clemmensen uses Zinc amalgam and HCl (Q). Wolff-Kishner uses Hydrazine and KOH (R). Rosenmund uses Hydrogen gas over poisoned Palladium (P).' },
{ id:'CHM12', year:'2019', q:'According to Faraday\'s First Law of Electrolysis, the mass of a substance deposited at an electrode is directly proportional to:', opts:['The voltage applied','The quantity of electricity passed','The concentration of the electrolyte','The surface area of the electrode'], ans:1, sol:'Faraday\'s First Law states m = Z * Q, where m is mass, Z is the electrochemical equivalent, and Q (I*t) is the total quantity of charge passed.' },
{ id:'CHM13', year:'2023', q:'A spontaneous reaction at constant temperature and pressure is characterized by:', opts:['Delta G > 0','Delta H > 0','Delta G < 0','Delta S < 0'], ans:2, sol:'For a process to be spontaneous at constant temperature and pressure, the change in Gibbs free energy (Delta G) must be negative (Delta G < 0).' },
{ id:'CHM14', year:'2022', q:'Which of the following carbocations is the most stable?', opts:['Primary (1°) carbocation','Secondary (2°) carbocation','Tertiary (3°) carbocation','Methyl carbocation'], ans:2, sol:'Tertiary carbocations are the most stable due to maximum +I (inductive) effect of three alkyl groups and maximum hyperconjugation (more alpha-hydrogens).' },
{ id:'CHM15', year:'2021', q:'Statement I: Phenol is more acidic than ethanol. Statement II: The phenoxide ion is stabilized by resonance.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Both are correct. Phenol readily loses a proton to form a phenoxide ion, which is highly stabilized by delocalization of the negative charge over the benzene ring, making it more acidic than aliphatic alcohols.' },
{ id:'CHM16', year:'2020', q:'The magnetic moment of an ion is calculated using the formula µ = √(n(n+2)) BM. Here, \'n\' represents:', opts:['Principal quantum number','Number of unpaired electrons','Total number of electrons','Oxidation state'], ans:1, sol:'The spin-only magnetic moment is given by µ = √(n(n+2)) Bohr Magnetons (BM), where \'n\' is the number of unpaired electrons in the ion.' },
{ id:'CHM17', year:'NEET Mock', q:'Identify the correct order of electronegativity:', opts:['F > O > N > C','O > F > N > C','F > N > O > C','N > O > F > C'], ans:0, sol:'Electronegativity increases across a period. Fluorine is the most electronegative element (4.0), followed by Oxygen (3.5), Nitrogen (3.0), and Carbon (2.5).' },
{ id:'CHM18', year:'2019', q:'Ozonolysis of an alkene yields one molecule of acetone and one molecule of formaldehyde. The original alkene was:', opts:['Propene','2-Methylpropene (Isobutylene)','But-2-ene','Ethene'], ans:1, sol:'Acetone is (CH3)2C=O and Formaldehyde is H2C=O. Joining them at the double bond gives (CH3)2C=CH2, which is 2-Methylpropene or isobutylene.' },
{ id:'CHM19', year:'2023', q:'Which of the following acts as a Lewis acid?', opts:['NH3','H2O','BF3','CH4'], ans:2, sol:'A Lewis acid is an electron-pair acceptor. BF3 is an electron-deficient molecule (only 6 electrons around Boron) and thus strongly accepts an electron pair.' },
{ id:'CHM20', year:'2022', q:'Assertion (A): A catalyst increases the rate of a reaction without itself being consumed. Reason (R): A catalyst lowers the activation energy of the reaction.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'A catalyst provides an alternative pathway for the reaction with a lower activation energy barrier, thereby increasing the rate of both forward and backward reactions.' },
{ id:'CHM21', year:'2021', q:'Which of the following metal ions gives a blood-red color with thiocyanate ion (SCN-)?', opts:['Cu2+','Fe3+','Ni2+','Co2+'], ans:1, sol:'Fe3+ reacts with the thiocyanate ion to form a complex [Fe(SCN)(H2O)5]2+, which imparts a characteristic intense blood-red color, used as a test for Iron(III).' },
{ id:'CHM22', year:'2020', q:'The reaction of primary aliphatic amines with nitrous acid (NaNO2 + HCl) at low temperature yields:', opts:['Diazonium salt','Nitroalkane','Alcohol and N2 gas','Secondary amine'], ans:2, sol:'Primary aliphatic amines form highly unstable aliphatic diazonium salts which immediately decompose to yield a mixture of alcohols and nitrogen gas.' },
{ id:'CHM23', year:'NEET Mock', q:'Match the thermodynamic process with its condition: (I) Isothermal (II) Adiabatic (III) Isochoric -> (P) Delta q = 0 (Q) Delta V = 0 (R) Delta T = 0', opts:['I-R, II-P, III-Q','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-Q, III-P'], ans:0, sol:'Isothermal means constant temperature (R). Adiabatic means no heat exchange (P). Isochoric means constant volume (Q).' },
{ id:'CHM24', year:'2019', q:'The primary valency of a metal ion in a coordination complex corresponds to its:', opts:['Coordination number','Oxidation state','Geometry','Number of ligands'], ans:1, sol:'According to Werner\'s theory, the primary valency corresponds to the oxidation state of the central metal ion and is ionizable. Secondary valency corresponds to the coordination number.' },
{ id:'CHM25', year:'2023', q:'In the Daniel cell, the standard electrode potential for the cell is 1.1 V. The anode and cathode are respectively made of:', opts:['Copper and Zinc','Zinc and Copper','Silver and Copper','Zinc and Silver'], ans:1, sol:'In a Daniel cell, oxidation occurs at the Zinc electrode (anode) and reduction occurs at the Copper electrode (cathode). Zn(s) | Zn2+(aq) || Cu2+(aq) | Cu(s).' },
{ id:'CHM26', year:'2022', q:'Which of the following tests is used to distinguish between aldehydes and ketones?', opts:['Lucas test','Hinsberg test','Tollens\' test','Iodoform test'], ans:2, sol:'Tollens\' test (ammoniacal silver nitrate) is a mild oxidizing agent that oxidizes aldehydes to carboxylate ions, forming a silver mirror. Ketones do not give this test.' },
{ id:'CHM27', year:'2021', q:'Statement I: Graphite is a good conductor of electricity. Statement II: In graphite, each carbon atom is sp2 hybridized, leaving one free electron per carbon.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Both are correct. The layered structure of graphite involves sp2 hybridization. The unhybridized p-orbital contains a free (delocalized) electron which conducts electricity parallel to the layers.' },
{ id:'CHM28', year:'2020', q:'Which among the following lanthanoids shows a +4 oxidation state well known in its chemistry?', opts:['Europium (Eu)','Cerium (Ce)','Gadolinium (Gd)','Lutetium (Lu)'], ans:1, sol:'Cerium (Ce) easily exhibits a +4 oxidation state (Ce4+) because it attains the highly stable noble gas configuration of Xenon (f0). It acts as a strong analytical oxidizing agent.' },
{ id:'CHM29', year:'NEET Mock', q:'Which rule states that "During the addition of an unsymmetrical reagent to an unsymmetrical alkene, the negative part of the reagent attaches to the carbon atom containing fewer hydrogen atoms"?', opts:['Saytzeff rule','Markovnikov\'s rule','Anti-Markovnikov\'s rule','Huckel\'s rule'], ans:1, sol:'This is the classic definition of Markovnikov\'s rule, which proceeds via the formation of the most stable carbocation intermediate.' },
{ id:'CHM30', year:'2019', q:'The conversion of an amide to a primary amine with one carbon atom less, using Br2 and NaOH, is called:', opts:['Gabriel phthalimide synthesis','Hoffmann bromamide degradation','Carbylamine reaction','Sandmeyer reaction'], ans:1, sol:'Hoffmann bromamide degradation reaction converts a primary amide (R-CONH2) into a primary amine (R-NH2) containing one carbon less, releasing a carbonate ion.' },
{ id:'CHM31', year:'2023', q:'A solid has a body-centered cubic (BCC) structure. The percentage of empty space (void volume) in this lattice is:', opts:['74%','68%','32%','26%'], ans:2, sol:'The packing efficiency of a BCC lattice is 68%. Therefore, the empty space (voids) remaining in the unit cell is 100% - 68% = 32%.' },
{ id:'CHM32', year:'2022', q:'Assertion (A): The bond order of N2 molecule is 3. Reason (R): Nitrogen molecule has a triple bond, consisting of one sigma and two pi bonds.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'According to Molecular Orbital Theory, Nb = 10 and Na = 4, giving Bond Order = (10-4)/2 = 3. This matches the Lewis structure showing a triple bond (one sigma, two pi).' },
{ id:'CHM33', year:'2021', q:'In which of the following compounds is the oxidation number of Oxygen +2?', opts:['H2O2','OF2','O3','K2O'], ans:1, sol:'Fluorine is the most electronegative element. In Oxygen difluoride (OF2), each F is -1, forcing Oxygen to exhibit a rare +2 oxidation state.' },
{ id:'CHM34', year:'2020', q:'Match the polymer with its monomer(s): (I) Nylon 6,6 (II) Teflon (III) Natural Rubber -> (P) Isoprene (Q) Tetrafluoroethene (R) Adipic acid and Hexamethylenediamine', opts:['I-R, II-Q, III-P','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-P, III-Q'], ans:0, sol:'Nylon 6,6 is a condensation polymer of Adipic acid and Hexamethylenediamine (R). Teflon is made from Tetrafluoroethene (Q). Natural rubber is polyisoprene (P).' },
{ id:'CHM35', year:'NEET Mock', q:'When phenol is treated with chloroform and aqueous NaOH at 340 K, followed by hydrolysis, the major product formed is:', opts:['Salicylic acid','Salicylaldehyde','Picric acid','p-Benzoquinone'], ans:1, sol:'This is the Reimer-Tiemann reaction. Phenol reacts with CHCl3/NaOH to introduce a formyl (-CHO) group at the ortho position, producing Salicylaldehyde as the major product.' },
{ id:'CHM36', year:'2019', q:'Statement I: Enantiomers are non-superimposable mirror images of each other. Statement II: A racemic mixture is optically inactive due to external compensation.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Both statements are true. Enantiomers rotate plane-polarized light in opposite directions. A 1:1 mixture (racemic) has zero net rotation because the rotations cancel each other out (external compensation).' },
{ id:'CHM37', year:'2023', q:'Which of the following orbitals has a spherical shape?', opts:['p-orbital','d-orbital','s-orbital','f-orbital'], ans:2, sol:'The s-orbital (where azimuthal quantum number l = 0) has a spherically symmetrical shape around the nucleus.' },
{ id:'CHM38', year:'2022', q:'Which equation correctly represents the Nernst Equation for a single electrode potential at 298 K?', opts:['E = E° - (0.0591/n) log [M(s)]/[Mn+]','E = E° - (0.0591/n) log [Mn+]/[M(s)]','E = E° + (0.0591/n) log [M(s)]/[Mn+]','E = E° - (n/0.0591) log [M(s)]/[Mn+]'], ans:0, sol:'The Nernst equation for reduction Mn+ + ne- -> M(s) is E = E° - (RT/nF) ln([M]/[Mn+]). At 298 K, this simplifies to E = E° - (0.0591/n) log(1/[Mn+]) since solid concentration is taken as 1.' },
{ id:'CHM39', year:'2021', q:'The color of KMnO4 is due to:', opts:['d-d transition','Ligand to metal charge transfer (LMCT)','Metal to ligand charge transfer (MLCT)','f-f transition'], ans:1, sol:'Manganese in KMnO4 is in the +7 oxidation state (d0 configuration). Since there are no d-electrons, d-d transition is impossible. The intense purple color is due to Charge Transfer from Oxygen to Manganese (LMCT).' },
{ id:'CHM40', year:'2020', q:'Aromatics exhibit a property of resonance. According to Huckel\'s rule, a compound is aromatic if it is planar, cyclic, completely conjugated, and has:', opts:['4n pi electrons','(4n + 2) pi electrons','2n pi electrons','(2n + 4) pi electrons'], ans:1, sol:'Huckel\'s rule of aromaticity requires the presence of (4n + 2) completely delocalized pi electrons in a planar, cyclic system, where n is an integer (0, 1, 2, ...).' },
{ id:'CHM41', year:'NEET Mock', q:'Assertion (A): H2O is a liquid while H2S is a gas at room temperature. Reason (R): Sulfur has a larger size and lower electronegativity compared to Oxygen, thus incapable of forming H-bonds.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'Hydrogen bonding requires a highly electronegative atom of small size (F, O, N). Sulfur is larger and less electronegative, so H2S does not form H-bonds and remains a gas.' },
{ id:'CHM42', year:'2019', q:'Aniline reacts with a mixture of conc. HNO3 and conc. H2SO4 to yield a significant amount of m-nitroaniline. This is because:', opts:['Amino group is meta directing','In strong acid, aniline is protonated to form anilinium ion which is meta directing','The ortho/para products are unstable','Steric hindrance prevents ortho/para attack'], ans:1, sol:'In a strongly acidic medium, aniline gets protonated to form the anilinium ion (-NH3+). This group acts as a strong deactivating and meta-directing group.' },
{ id:'CHM43', year:'2023', q:'What is the highest oxidation state exhibited by an Actinoid element?', opts:['+4','+5','+6','+7'], ans:3, sol:'Actinoids show a greater range of oxidation states due to the comparable energies of 5f, 6d, and 7s orbitals. Elements like Neptunium (Np) and Plutonium (Pu) can exhibit a maximum oxidation state of +7.' },
{ id:'CHM44', year:'2022', q:'Match the vitamin with its deficiency disease: (I) Vitamin A (II) Vitamin B12 (III) Vitamin C -> (P) Scurvy (Q) Pernicious anemia (R) Night blindness', opts:['I-R, II-Q, III-P','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-P, III-Q'], ans:0, sol:'Vitamin A deficiency causes Night blindness (R). B12 deficiency causes Pernicious anemia (Q). Vitamin C deficiency causes Scurvy (P).' },
{ id:'CHM45', year:'2021', q:'Which of the following compounds will give a positive Iodoform test?', opts:['Methanol','Propan-1-ol','Ethanol','Pentan-3-one'], ans:2, sol:'The iodoform test is given by compounds containing the CH3-CO- group or those that can be oxidized to it (CH3-CH(OH)- group). Ethanol (CH3CH2OH) oxidizes to acetaldehyde (CH3CHO) and thus gives a positive test.' }
],

};
            
            let collectedAll = [];
            const subjects = ['Physics', 'Chemistry', 'Botany', 'Zoology'];
            for (let sub of subjects) {
                const key = sub.toLowerCase();
                const qList = questions[key] || [];
                const mapped = qList.map(q => ({
                    sub: sub,
                    q: q.q,
                    opts: q.opts,
                    ans: q.ans !== undefined ? q.ans : -1,
                    exp: q.sol || "No detailed explanation provided for this question."
                }));
                collectedAll = collectedAll.concat(mapped);
            }
            
            QUESTIONS = collectedAll;
            status = new Array(QUESTIONS.length).fill('not-visited');
            answers = new Array(QUESTIONS.length).fill(null);
            examView.innerHTML = origHtml;
            
            renderPalette();
            loadQuestion(0);
            startTimer();
        } catch(e) {
            examView.innerHTML = '<div style="text-align:center; padding:40px; color:red;">Failed to load PYQ data.</div>';
            console.error(e);
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitExam();
                return;
            }
            timeLeft--;
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            document.getElementById('timerText').textContent = `${h > 0 ? h + ':' : ''}${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            if (timeLeft < 600) document.getElementById('timerText').style.color = '#ef4444';
        }, 1000);
    }

    function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';
        QUESTIONS.forEach((q, i) => {
            const btn = document.createElement('div');
            btn.className = `p-btn ${status[i]} ${i === currentIdx ? 'active' : ''}`;
            btn.textContent = (i + 1).toString();
            btn.id = `palBtn-${i}`;
            btn.onclick = () => loadQuestion(i);
            grid.appendChild(btn);
        });
        scrollPaletteToActive();
        updateProgressBar();
    }

    function scrollPaletteToActive() {
        const activeBtn = document.getElementById(`palBtn-${currentIdx}`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function updateProgressBar() {
        const ans = status.filter(s => s === 'answered' || s === 'marked-answered').length;
        const mark = status.filter(s => s === 'marked' || s === 'marked-answered').length;
        const total = QUESTIONS.length;
        const perc = (ans / total) * 100;
        document.getElementById('progressBar').style.width = perc + '%';
        document.getElementById('progressText').innerHTML = `<span>ANS: <b>${ans}</b></span> <span>MARKED: <b>${mark}</b></span> <span>TOTAL: <b>${total}</b></span>`;
    }

    function jumpToSubject(sub) {
        const idx = QUESTIONS.findIndex(q => q.sub === sub);
        if (idx !== -1) loadQuestion(idx);
    }

    function updateTabs() {
        const sub = QUESTIONS[currentIdx].sub;
        document.querySelectorAll('.s-tab').forEach(tab => {
            tab.classList.toggle('active', tab.textContent === sub);
        });
    }

    function loadQuestion(idx) {
        if (status[currentIdx] === 'not-visited') status[currentIdx] = 'not-answered';
        currentIdx = idx;
        const q = QUESTIONS[idx];
        
        document.getElementById('qSubject').textContent = q.sub;
        document.getElementById('qCounter').textContent = `Question ${idx + 1}/${QUESTIONS.length}`;
        document.getElementById('qText').innerHTML = q.q;
        document.querySelector('.q-section').scrollTop = 0;

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        const letters = ['A','B','C','D'];
        
        q.opts.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = `opt-btn ${userAnswers[idx] === i ? 'selected' : ''}`;
            btn.innerHTML = `<div class="opt-letter">${letters[i]}</div> <span>${opt}</span>`;
            btn.onclick = () => selectOption(i);
            grid.appendChild(btn);
        });

        if (idx === QUESTIONS.length - 1) {
            document.getElementById('btnSubmit').style.display = 'block';
        }

        updateTabs();
        renderPalette();
    }

    function selectOption(optIdx) {
        userAnswers[currentIdx] = optIdx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((b, i) => b.classList.toggle('selected', i === optIdx));
        
        // Auto update status if marked, keep marked-answered
        if (status[currentIdx] === 'marked' || status[currentIdx] === 'marked-answered') {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'answered';
        }
        renderPalette();
    }

    function handleClear() {
        userAnswers[currentIdx] = null;
        // If it was marked-answered, revert to marked. Otherwise not-answered.
        status[currentIdx] = (status[currentIdx] === 'marked-answered') ? 'marked' : 'not-answered';
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.classList.remove('selected'));
        renderPalette();
    }

    function handleMark() {
        if (userAnswers[currentIdx] !== null) {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'marked';
        }
        renderPalette();
        if (currentIdx < QUESTIONS.length - 1) loadQuestion(currentIdx + 1);
    }

    function handleNext() {
        if (userAnswers[currentIdx] === null && status[currentIdx] !== 'marked' && status[currentIdx] !== 'marked-answered') {
            status[currentIdx] = 'not-answered';
        }
        if (currentIdx < QUESTIONS.length - 1) {
            loadQuestion(currentIdx + 1);
        } else {
            confirmSubmit();
        }
    }

    function confirmSubmit() {
        if (confirm("Are you sure you want to submit the exam?")) {
            submitExam();
        }
    }

    function submitExam() {
        clearInterval(timerInterval);
        document.getElementById('examView').classList.add('hidden');
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('resultView').style.display = 'block';
        renderResults();
    }

    function renderResults(filter = 'all') {
        const container = document.getElementById('reviewContainer');
        container.innerHTML = `<h3 style="margin: 20px 4px 12px; font-weight: 800; font-size: 18px;">Detailed Review</h3>
            <div class="sub-tabs" style="margin-bottom:20px">
                <div class="s-tab ${filter === 'all' ? 'active' : ''}" onclick="renderResults('all')">All</div>
                <div class="s-tab ${filter === 'wrong' ? 'active' : ''}" onclick="renderResults('wrong')">Incorrect</div>
                <div class="s-tab ${filter === 'correct' ? 'active' : ''}" onclick="renderResults('correct')">Correct</div>
                <div class="s-tab ${filter === 'skipped' ? 'active' : ''}" onclick="renderResults('skipped')">Skipped</div>
            </div>`;

        let correct = 0;
        let wrong = 0;
        let skipped = 0;

        QUESTIONS.forEach((q, i) => {
            if (userAnswers[i] === null) skipped++;
            else if (userAnswers[i] === q.ans) correct++;
            else wrong++;
        });

        const score = (correct * 4) - (wrong * 1);
        document.getElementById('resScore').textContent = score;
        document.getElementById('resCorrect').textContent = correct;
        document.getElementById('resWrong').textContent = wrong;
        document.getElementById('resSkipped').textContent = skipped;

        QUESTIONS.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.ans;
            const isSkipped = userAnswers[i] === null;
            
            if (filter === 'wrong' && (isCorrect || isSkipped)) return;
            if (filter === 'correct' && (!isCorrect || isSkipped)) return;
            if (filter === 'skipped' && !isSkipped) return;

            const item = document.createElement('div');
            item.className = 'rev-item';
            
            let userAnsText = isSkipped ? 'Not Answered' : q.opts[userAnswers[i]];
            let statusColor = isCorrect ? 'correct' : (isSkipped ? '' : 'wrong');
            
            item.innerHTML = `
                <div class="rev-q"><span style="color:var(--text-sub)">#${i+1}</span> ${q.q}</div>
                <div class="rev-ans ${statusColor}">
                    <b>Your Answer:</b> ${userAnsText} ${isCorrect ? '✓' : ''}
                </div>
                ${!isCorrect ? `
                <div class="rev-ans correct">
                    <b>Correct Answer:</b> ${q.opts[q.ans]}
                </div>` : ''}
                <div class="rev-exp">
                    <b>Explanation:</b> ${q.exp}
                </div>
            `;
            container.appendChild(item);
        });
    }

    function handleExit() {
        if (confirm("Do you want to exit the mock test? Your progress will be lost.")) {
            window.history.back();
        }
    }

    init();
</script>

</body>
</html>
