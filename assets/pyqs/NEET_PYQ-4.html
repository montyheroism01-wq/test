{ id:'CH6', year:'2019', q:'The relative lowering of vapour pressure of an aqueous solution containing a non-volatile solute is equal to the:', opts:['Mole fraction of the solvent','Mole fraction of the solute','Molality of the solution','Molarity of the solution'], ans:1, sol:'According to Raoult\'s law for a solution containing a non-volatile solute, (P0 - Ps)/P0 = x_solute, where x_solute is the mole fraction of the solute.' },
{ id:'CH7', year:'2023', q:'Assertion (A): Cooking time is reduced in a pressure cooker. Reason (R): The boiling point of water inside the cooker is elevated due to increased pressure.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'In a pressure cooker, the high pressure increases the boiling point of water (above 100°C). This higher temperature cooks the food faster.' },
{ id:'CH8', year:'2022', q:'Which of the following aqueous solutions should have the highest boiling point? (Assume complete dissociation)', opts:['1.0 M NaOH','1.0 M Na2SO4','1.0 M NH4NO3','1.0 M KNO3'], ans:1, sol:'Elevation in boiling point (Delta Tb) = i * Kb * m. Na2SO4 dissociates into 3 ions (i=3), while the others dissociate into 2 ions (i=2). Highest \'i\' gives the highest boiling point.' },
{ id:'CH9', year:'2021', q:'The condition for an ideal solution is:', opts:['Delta H_mix = 0, Delta V_mix = 0','Delta H_mix > 0, Delta V_mix > 0','Delta H_mix < 0, Delta V_mix < 0','Delta H_mix = 0, Delta V_mix > 0'], ans:0, sol:'For an ideal solution, the interactions between A-A, B-B, and A-B are identical. Therefore, there is no change in enthalpy (Delta H_mix = 0) and no change in volume (Delta V_mix = 0) upon mixing.' },
{ id:'CH10', year:'2020', q:'People living at high altitudes experience a condition called \'anoxia\'. This is primarily due to:', opts:['Low temperature at high altitudes','High atmospheric pressure at high altitudes','Low partial pressure of oxygen at high altitudes','High concentration of carbon dioxide in the blood'], ans:2, sol:'At high altitudes, the partial pressure of O2 is lower than at ground level. According to Henry\'s law, this results in lower solubility of O2 in the blood and tissues, causing weakness and confusion (anoxia).' },
{ id:'CH11', year:'NEET Mock', q:'Match the colligative property with its formula: (I) Elevation of boiling point (II) Osmotic pressure (III) Depression in freezing point -> (P) pi = CRT (Q) Delta Tf = Kf * m (R) Delta Tb = Kb * m', opts:['I-R, II-P, III-Q','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-Q, III-P'], ans:0, sol:'Elevation of BP: Delta Tb = Kb * m (R). Osmotic Pressure: pi = CRT (P). Depression of FP: Delta Tf = Kf * m (Q).' },
{ id:'CH12', year:'2019', q:'When a solute undergoes association in a solvent, the Van\'t Hoff factor (i) is:', opts:['Greater than 1','Equal to 1','Less than 1','Zero'], ans:2, sol:'If molecules associate (e.g., dimerization of acetic acid in benzene), the number of particles in the solution decreases, making the Van\'t Hoff factor (i) less than 1.' },
{ id:'CH13', year:'2023', q:'The ebullioscopic constant (Kb) of a solvent depends only on:', opts:['The nature of the solute','The nature of the solvent','The temperature of the solution','The concentration of the solution'], ans:1, sol:'Kb (molal elevation constant) and Kf (molal depression constant) are characteristic properties of the solvent and do not depend on the nature or concentration of the solute.' },
{ id:'CH14', year:'2022', q:'At exactly the same temperature, which pair of solutions are isotonic? (Assume complete dissociation)', opts:['0.1 M NaCl and 0.1 M Na2SO4','0.1 M Urea and 0.1 M MgCl2','0.1 M BaCl2 and 0.1 M K2SO4','0.1 M Glucose and 0.1 M NaCl'], ans:2, sol:'Isotonic solutions must have the same effective concentration (i * C). For BaCl2, i=3, so effective conc = 0.3 M. For K2SO4, i=3, so effective conc = 0.3 M. Hence, they are isotonic.' },
{ id:'CH15', year:'2021', q:'Assertion (A): Adding ethylene glycol to water lowers its freezing point. Reason (R): Ethylene glycol is heavily used as an antifreeze in car radiators.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:1, sol:'Both statements are true. Adding a non-volatile solute (ethylene glycol) depresses the freezing point of water. This is exactly WHY it is used as antifreeze, but R is the application, not the scientific explanation for A.' },
{ id:'CH16', year:'2020', q:'A mixture of two completely miscible non-ideal liquids which boils at a constant temperature like a pure liquid is called:', opts:['Solid solution','Azeotropic mixture','Colloidal solution','Ideal mixture'], ans:1, sol:'An azeotrope is a mixture of liquids that maintains its composition and boiling point during distillation, behaving like a pure liquid.' },
{ id:'CH17', year:'NEET Mock', q:'The Van\'t Hoff factor (i) for a dilute aqueous solution of the strong electrolyte barium hydroxide, Ba(OH)2, is:', opts:['1','2','3','4'], ans:2, sol:'Ba(OH)2 is a strong electrolyte and dissociates completely into one Ba2+ ion and two OH- ions. Total number of ions = 1 + 2 = 3. Therefore, i = 3.' },
{ id:'CH18', year:'2019', q:'Statement I: Reverse osmosis is used for the desalination of seawater. Statement II: In reverse osmosis, pressure greater than the osmotic pressure is applied to the solution side.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Both statements are true. Applying a pressure greater than the osmotic pressure on the solution side reverses the direction of osmosis, pushing pure water out through the semipermeable membrane.' },
{ id:'CH19', year:'2023', q:'Which of the following will have the lowest vapour pressure at a given temperature?', opts:['Pure water','0.1 M NaCl solution','0.1 M Sucrose solution','0.1 M BaCl2 solution'], ans:3, sol:'Lowering of vapour pressure is a colligative property. BaCl2 gives 3 ions (i=3), NaCl gives 2 (i=2), and sucrose gives 1 (i=1). BaCl2 produces the maximum number of particles, hence maximum lowering of vapour pressure.' },
{ id:'CH20', year:'2022', q:'If a red blood cell is placed in a hypertonic solution, it will:', opts:['Swell and burst','Shrink (Plasmolysis)','Remain unaffected','Divide into two'], ans:1, sol:'A hypertonic solution has a higher solute concentration than the fluid inside the RBC. Water will move out of the cell via osmosis, causing the cell to shrink (crenation/plasmolysis).' },
{ id:'CH21', year:'2021', q:'According to Raoult\'s law, the partial vapour pressure of a volatile component in a solution is directly proportional to its:', opts:['Molarity','Molality','Mole fraction','Mass percentage'], ans:2, sol:'Raoult\'s Law states that for a solution of volatile liquids, the partial vapour pressure of each component is directly proportional to its mole fraction in the solution (P1 = P1_0 * x1).' },
{ id:'CH22', year:'2020', q:'Minimum boiling azeotropes are formed by solutions showing:', opts:['Large positive deviation from Raoult\'s law','Large negative deviation from Raoult\'s law','Ideal behaviour','No deviation from Henry\'s law'], ans:0, sol:'Solutions that show a large positive deviation from Raoult\'s law (weaker A-B interactions) have higher vapour pressure and boil at a lower temperature, forming minimum boiling azeotropes (e.g., Ethanol + Water).' },
{ id:'CH23', year:'NEET Mock', q:'Match the units with their physical quantities: (I) Molarity (II) Molality (III) Ebullioscopic constant -> (P) mol/kg (Q) K kg/mol (R) mol/L', opts:['I-R, II-P, III-Q','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-Q, III-P'], ans:0, sol:'Molarity is moles per litre (R). Molality is moles per kg of solvent (P). Ebullioscopic constant (Kb) is measured in K kg mol-1 (Q).' },
{ id:'CH24', year:'2019', q:'Assertion (A): Camphor is often used as a solvent for determining the molecular mass of non-volatile solutes by cryoscopy. Reason (R): Camphor has a very high molal depression constant (Kf).', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'Camphor has a remarkably high Kf value (approx 39.7 K kg/mol), which means even a tiny amount of solute causes a large, easily measurable depression in its freezing point (Rast method).' },
{ id:'CH25', year:'2023', q:'Two liquids A and B form an ideal solution. At 300 K, the vapour pressure of pure A is 100 mm Hg and that of pure B is 200 mm Hg. If an equimolar mixture is prepared, the mole fraction of A in the vapour phase is:', opts:['0.33','0.50','0.67','0.25'], ans:0, sol:'Equimolar means xA = 0.5, xB = 0.5. PA = P0A * xA = 100 * 0.5 = 50. PB = P0B * xB = 200 * 0.5 = 100. P_total = 150. Mole fraction of A in vapour (yA) = PA / P_total = 50 / 150 = 1/3 = 0.33.' },
{ id:'CH26', year:'2022', q:'The semipermeable membrane used during the measurement of osmotic pressure of a solution allows the passage of:', opts:['Solute molecules only','Solvent molecules only','Both solvent and solute molecules','Only ions'], ans:1, sol:'A semipermeable membrane (like Cu2[Fe(CN)6] or pig\'s bladder) contains microscopic pores that allow only the smaller solvent molecules (like water) to pass through, blocking the larger solute molecules.' },
{ id:'CH27', year:'2021', q:'If alpha is the degree of dissociation of Na2SO4, the Van\'t Hoff factor (i) used for calculating the molecular mass is:', opts:['1 + alpha','1 - alpha','1 + 2*alpha','1 - 2*alpha'], ans:2, sol:'Na2SO4 dissociates into 2Na+ and SO4(2-). Total ions n = 3. The formula relating i and alpha is i = 1 + (n - 1)*alpha. Therefore, i = 1 + (3 - 1)*alpha = 1 + 2*alpha.' },
{ id:'CH28', year:'2020', q:'Statement I: The boiling point of 0.1 M urea solution is less than that of 0.1 M KCl solution. Statement II: Elevation of boiling point is directly proportional to the number of particles in the solution.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Urea is a non-electrolyte (i=1), while KCl dissociates into two ions (i=2). Since colligative properties depend on the number of particles, KCl will have a higher boiling point elevation. Both statements are correct.' },
{ id:'CH29', year:'NEET Mock', q:'The relation between osmotic pressure (pi), molarity (C), and temperature (T) was given by:', opts:['Raoult','Van\'t Hoff','Henry','Ostwald'], ans:1, sol:'Jacobus Henricus van \'t Hoff proposed the equation pi = CRT, showing that for dilute solutions, osmotic pressure behaves similarly to the ideal gas law.' },
{ id:'CH30', year:'2019', q:'Which of the following units is useful in relating the concentration of a solution with its vapour pressure?', opts:['Mole fraction','Parts per million','Mass percentage','Molality'], ans:0, sol:'Raoult\'s law relates the vapour pressure of a component directly to its mole fraction in the solution (P = P0 * x).' },
{ id:'CH31', year:'2023', q:'Assertion (A): When NaCl is added to water, a depression in the freezing point is observed. Reason (R): The vapour pressure of a solution is decreased by the addition of a non-volatile solute.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'The addition of a non-volatile solute lowers the vapour pressure of the solvent. Consequently, the temperature at which the solid and liquid phases have the same vapour pressure (freezing point) also decreases.' },
{ id:'CH32', year:'2022', q:'Maximum freezing point will be observed for which of the following 0.1 M aqueous solutions?', opts:['NaCl','Urea','MgCl2','Al2(SO4)3'], ans:1, sol:'Depression in freezing point (Delta Tf) is highest for maximum particles. Urea has the lowest i (i=1), so it will have the MINIMUM depression, meaning its freezing point will remain the HIGHEST (closest to 0°C).' },
{ id:'CH33', year:'2021', q:'Match the phenomena: (I) Scuba diving (II) Desalination of seawater (III) Non-ideal mixture of HNO3 and H2O -> (P) Reverse osmosis (Q) Maximum boiling azeotrope (R) Henry\'s law', opts:['I-R, II-P, III-Q','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-Q, III-P'], ans:0, sol:'Scuba diving tanks use He to avoid bends (Henry\'s law - R). Desalination uses Reverse Osmosis (P). HNO3 and Water show large negative deviation, forming a Maximum boiling azeotrope (Q).' },
{ id:'CH34', year:'2020', q:'The boiling point of a solvent is Tb. When a non-volatile solute is added, the boiling point of the solution becomes Ts. The elevation in boiling point is:', opts:['Tb - Ts','Ts - Tb','Ts / Tb','Tb / Ts'], ans:1, sol:'The solution boils at a higher temperature than the pure solvent. Therefore, elevation in boiling point (Delta Tb) = Ts (solution) - Tb (solvent).' },
{ id:'CH35', year:'NEET Mock', q:'The freezing point depression constant for water is 1.86 K kg/mol. If 5.00 g of Na2SO4 (Molar mass = 142 g/mol) is dissolved in 45.0 g of H2O, the freezing point is changed by approx (assume i=3):', opts:['3.82 K','4.36 K','2.18 K','1.25 K'], ans:1, sol:'Molality m = (5/142) / (45/1000) = 0.0352 / 0.045 = 0.782 m. Delta Tf = i * Kf * m = 3 * 1.86 * 0.782 = 4.36 K.' },
{ id:'CH36', year:'2019', q:'The solubility of a gas in a liquid decreases with an increase in:', opts:['Pressure','Temperature','Amount of solvent','Volume of gas'], ans:1, sol:'Dissolution of a gas in a liquid is an exothermic process. According to Le Chatelier\'s principle, increasing the temperature shifts the equilibrium backward, decreasing gas solubility.' },
{ id:'CH37', year:'2023', q:'Statement I: Isotonic solutions do not show the phenomenon of osmosis when separated by a semipermeable membrane. Statement II: Isotonic solutions have the same vapour pressure at a given temperature.', opts:['Both statements are correct','Both statements are incorrect','Statement I is correct, II is incorrect','Statement I is incorrect, II is correct'], ans:0, sol:'Isotonic solutions have identical osmotic pressures and effective concentrations. Hence, no net movement of solvent occurs. Because their concentrations are the same, their vapour pressure lowering is also identical.' },
{ id:'CH38', year:'2022', q:'A complex K4[Fe(CN)6] is 50% dissociated in an aqueous solution. What is its Van\'t Hoff factor (i)?', opts:['3.0','5.0','2.5','3.0'], ans:0, sol:'K4[Fe(CN)6] dissociates into 4 K+ and 1 [Fe(CN)6]4- ion (n=5). For 50% dissociation, alpha = 0.5. i = 1 + (n - 1)*alpha = 1 + (5 - 1)*0.5 = 1 + 2 = 3.0.' },
{ id:'CH39', year:'2021', q:'Which of the following is NOT a colligative property?', opts:['Osmotic pressure','Elevation in boiling point','Depression in freezing point','Vapour pressure'], ans:3, sol:'Vapour pressure itself is not a colligative property. However, the RELATIVE lowering of vapour pressure is a colligative property as it depends on the number of solute particles.' },
{ id:'CH40', year:'2020', q:'Which condition holds true for a solution showing negative deviation from Raoult\'s law?', opts:['A-B interactions are stronger than A-A and B-B interactions','A-B interactions are weaker than A-A and B-B interactions','Volume increases upon mixing','Heat is absorbed upon mixing'], ans:0, sol:'In negative deviation, the solute-solvent (A-B) attractive forces are stronger than the pure component forces (A-A or B-B). This causes escaping tendency to decrease, lowering vapour pressure. Delta V and Delta H are negative.' },
{ id:'CH41', year:'NEET Mock', q:'Assertion (A): Molecular mass of acetic acid determined by depression in freezing point method in benzene is roughly 120 g/mol. Reason (R): Acetic acid undergoes dimerization in benzene due to hydrogen bonding.', opts:['Both A and R are true, R is the correct explanation','Both A and R are true, R is not the correct explanation','A is true, R is false','A is false, R is true'], ans:0, sol:'The normal molar mass of CH3COOH is 60 g/mol. In benzene, it dimerizes (i = 0.5), so the colligative property observed is half of expected, making the calculated molar mass double (120 g/mol).' },
{ id:'CH42', year:'2019', q:'In the expression for relative lowering of vapour pressure, (P0 - P)/P0 = n2/(n1 + n2), the term n2 represents:', opts:['Moles of solvent','Moles of solute','Mass of solute','Molar mass of solvent'], ans:1, sol:'In the mole fraction formula x2 = n2 / (n1 + n2), n2 represents the number of moles of the non-volatile solute, while n1 represents the moles of the solvent.' },
{ id:'CH43', year:'2023', q:'Which concentration unit is most suitable for expressing the concentration of very dilute solutions (like pollutants in water)?', opts:['Molality','Molarity','Parts per million (ppm)','Mass percentage'], ans:2, sol:'Parts per million (ppm) is used to express the concentration of a solute present in trace quantities. 1 ppm means 1 part of solute per million (10^6) parts of the solution.' },
{ id:'CH44', year:'2022', q:'Match the mixtures with their separation difficulty: (I) Pure water (II) Azeotrope (III) Ideal solution -> (P) Separated by simple fractional distillation (Q) Boils at constant temperature without changing composition (R) Boils at 100 °C at 1 atm', opts:['I-R, II-Q, III-P','I-P, II-Q, III-R','I-Q, II-R, III-P','I-R, II-P, III-Q'], ans:0, sol:'Pure water boils at 100°C (R). An azeotrope behaves like a pure liquid and boils without changing composition (Q). Components of an ideal solution can be separated by fractional distillation (P).' },
{ id:'CH45', year:'2021', q:'If a 0.1 M solution of glucose and a 0.1 M solution of urea are separated by a semipermeable membrane, which of the following will happen?', opts:['Water will flow from glucose to urea','Water will flow from urea to glucose','No net movement of water will take place','Both solutes will cross the membrane'], ans:2, sol:'Both glucose and urea are non-electrolytes (i=1), so both 0.1 M solutions have the same osmotic pressure (they are isotonic). Therefore, there will be no net osmosis across the membrane.' }
],

};
            
            let collectedAll = [];
            const subjects = ['Physics', 'Chemistry', 'Botany', 'Zoology'];
            for (let sub of subjects) {
                const key = sub.toLowerCase();
                const qList = questions[key] || [];
                const mapped = qList.map(q => ({
                    sub: sub,
                    q: q.q,
                    opts: q.opts,
                    ans: q.ans !== undefined ? q.ans : -1,
                    exp: q.sol || "No detailed explanation provided for this question."
                }));
                collectedAll = collectedAll.concat(mapped);
            }
            
            QUESTIONS = collectedAll;
            status = new Array(QUESTIONS.length).fill('not-visited');
            answers = new Array(QUESTIONS.length).fill(null);
            examView.innerHTML = origHtml;
            
            renderPalette();
            loadQuestion(0);
            startTimer();
        } catch(e) {
            examView.innerHTML = '<div style="text-align:center; padding:40px; color:red;">Failed to load PYQ data.</div>';
            console.error(e);
        }
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                submitExam();
                return;
            }
            timeLeft--;
            const h = Math.floor(timeLeft / 3600);
            const m = Math.floor((timeLeft % 3600) / 60);
            const s = timeLeft % 60;
            document.getElementById('timerText').textContent = `${h > 0 ? h + ':' : ''}${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            if (timeLeft < 600) document.getElementById('timerText').style.color = '#ef4444';
        }, 1000);
    }

    function renderPalette() {
        const grid = document.getElementById('paletteGrid');
        grid.innerHTML = '';
        QUESTIONS.forEach((q, i) => {
            const btn = document.createElement('div');
            btn.className = `p-btn ${status[i]} ${i === currentIdx ? 'active' : ''}`;
            btn.textContent = (i + 1).toString();
            btn.id = `palBtn-${i}`;
            btn.onclick = () => loadQuestion(i);
            grid.appendChild(btn);
        });
        scrollPaletteToActive();
        updateProgressBar();
    }

    function scrollPaletteToActive() {
        const activeBtn = document.getElementById(`palBtn-${currentIdx}`);
        if (activeBtn) {
            activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function updateProgressBar() {
        const ans = status.filter(s => s === 'answered' || s === 'marked-answered').length;
        const mark = status.filter(s => s === 'marked' || s === 'marked-answered').length;
        const total = QUESTIONS.length;
        const perc = (ans / total) * 100;
        document.getElementById('progressBar').style.width = perc + '%';
        document.getElementById('progressText').innerHTML = `<span>ANS: <b>${ans}</b></span> <span>MARKED: <b>${mark}</b></span> <span>TOTAL: <b>${total}</b></span>`;
    }

    function jumpToSubject(sub) {
        const idx = QUESTIONS.findIndex(q => q.sub === sub);
        if (idx !== -1) loadQuestion(idx);
    }

    function updateTabs() {
        const sub = QUESTIONS[currentIdx].sub;
        document.querySelectorAll('.s-tab').forEach(tab => {
            tab.classList.toggle('active', tab.textContent === sub);
        });
    }

    function loadQuestion(idx) {
        if (status[currentIdx] === 'not-visited') status[currentIdx] = 'not-answered';
        currentIdx = idx;
        const q = QUESTIONS[idx];
        
        document.getElementById('qSubject').textContent = q.sub;
        document.getElementById('qCounter').textContent = `Question ${idx + 1}/${QUESTIONS.length}`;
        document.getElementById('qText').innerHTML = q.q;
        document.querySelector('.q-section').scrollTop = 0;

        const grid = document.getElementById('optionsGrid');
        grid.innerHTML = '';
        const letters = ['A','B','C','D'];
        
        q.opts.forEach((opt, i) => {
            const btn = document.createElement('div');
            btn.className = `opt-btn ${userAnswers[idx] === i ? 'selected' : ''}`;
            btn.innerHTML = `<div class="opt-letter">${letters[i]}</div> <span>${opt}</span>`;
            btn.onclick = () => selectOption(i);
            grid.appendChild(btn);
        });

        if (idx === QUESTIONS.length - 1) {
            document.getElementById('btnSubmit').style.display = 'block';
        }

        updateTabs();
        renderPalette();
    }

    function selectOption(optIdx) {
        userAnswers[currentIdx] = optIdx;
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach((b, i) => b.classList.toggle('selected', i === optIdx));
        
        // Auto update status if marked, keep marked-answered
        if (status[currentIdx] === 'marked' || status[currentIdx] === 'marked-answered') {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'answered';
        }
        renderPalette();
    }

    function handleClear() {
        userAnswers[currentIdx] = null;
        // If it was marked-answered, revert to marked. Otherwise not-answered.
        status[currentIdx] = (status[currentIdx] === 'marked-answered') ? 'marked' : 'not-answered';
        const btns = document.querySelectorAll('.opt-btn');
        btns.forEach(b => b.classList.remove('selected'));
        renderPalette();
    }

    function handleMark() {
        if (userAnswers[currentIdx] !== null) {
            status[currentIdx] = 'marked-answered';
        } else {
            status[currentIdx] = 'marked';
        }
        renderPalette();
        if (currentIdx < QUESTIONS.length - 1) loadQuestion(currentIdx + 1);
    }

    function handleNext() {
        if (userAnswers[currentIdx] === null && status[currentIdx] !== 'marked' && status[currentIdx] !== 'marked-answered') {
            status[currentIdx] = 'not-answered';
        }
        if (currentIdx < QUESTIONS.length - 1) {
            loadQuestion(currentIdx + 1);
        } else {
            confirmSubmit();
        }
    }

    function confirmSubmit() {
        if (confirm("Are you sure you want to submit the exam?")) {
            submitExam();
        }
    }

    function submitExam() {
        clearInterval(timerInterval);
        document.getElementById('examView').classList.add('hidden');
        document.getElementById('actionButtons').classList.add('hidden');
        document.getElementById('resultView').style.display = 'block';
        renderResults();
    }

    function renderResults(filter = 'all') {
        const container = document.getElementById('reviewContainer');
        container.innerHTML = `<h3 style="margin: 20px 4px 12px; font-weight: 800; font-size: 18px;">Detailed Review</h3>
            <div class="sub-tabs" style="margin-bottom:20px">
                <div class="s-tab ${filter === 'all' ? 'active' : ''}" onclick="renderResults('all')">All</div>
                <div class="s-tab ${filter === 'wrong' ? 'active' : ''}" onclick="renderResults('wrong')">Incorrect</div>
                <div class="s-tab ${filter === 'correct' ? 'active' : ''}" onclick="renderResults('correct')">Correct</div>
                <div class="s-tab ${filter === 'skipped' ? 'active' : ''}" onclick="renderResults('skipped')">Skipped</div>
            </div>`;

        let correct = 0;
        let wrong = 0;
        let skipped = 0;

        QUESTIONS.forEach((q, i) => {
            if (userAnswers[i] === null) skipped++;
            else if (userAnswers[i] === q.ans) correct++;
            else wrong++;
        });

        const score = (correct * 4) - (wrong * 1);
        document.getElementById('resScore').textContent = score;
        document.getElementById('resCorrect').textContent = correct;
        document.getElementById('resWrong').textContent = wrong;
        document.getElementById('resSkipped').textContent = skipped;

        QUESTIONS.forEach((q, i) => {
            const isCorrect = userAnswers[i] === q.ans;
            const isSkipped = userAnswers[i] === null;
            
            if (filter === 'wrong' && (isCorrect || isSkipped)) return;
            if (filter === 'correct' && (!isCorrect || isSkipped)) return;
            if (filter === 'skipped' && !isSkipped) return;

            const item = document.createElement('div');
            item.className = 'rev-item';
            
            let userAnsText = isSkipped ? 'Not Answered' : q.opts[userAnswers[i]];
            let statusColor = isCorrect ? 'correct' : (isSkipped ? '' : 'wrong');
            
            item.innerHTML = `
                <div class="rev-q"><span style="color:var(--text-sub)">#${i+1}</span> ${q.q}</div>
                <div class="rev-ans ${statusColor}">
                    <b>Your Answer:</b> ${userAnsText} ${isCorrect ? '✓' : ''}
                </div>
                ${!isCorrect ? `
                <div class="rev-ans correct">
                    <b>Correct Answer:</b> ${q.opts[q.ans]}
                </div>` : ''}
                <div class="rev-exp">
                    <b>Explanation:</b> ${q.exp}
                </div>
            `;
            container.appendChild(item);
        });
    }

    function handleExit() {
        if (confirm("Do you want to exit the mock test? Your progress will be lost.")) {
            window.history.back();
        }
    }

    init();
</script>

</body>
</html>
