<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEET Original PYQ - Set 1</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        
        :root {
            --bg: #020617;
            --card: rgba(15, 23, 42, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --neon-blue: #00e5ff;
            --neon-purple: #a855f7;
            --neon-green: #10b981;
            --neon-red: #ef4444;
            --neon-yellow: #f59e0b;
            --header-bg: rgba(2, 6, 23, 0.85);
            --tab-bg: rgba(2, 6, 23, 0.95);
        }

        body.light-theme {
            --bg: #f1f5f9;
            --card: #ffffff;
            --card-border: rgba(0, 0, 0, 0.1);
            --text-main: #0f172a;
            --text-sub: #64748b;
            --neon-blue: #0284c7;
            --neon-purple: #7c3aed;
            --header-bg: rgba(255, 255, 255, 0.9);
            --tab-bg: rgba(248, 250, 252, 0.98);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif;
            overflow-x: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column;
            transition: background 0.3s, color 0.3s;
        }

        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(0, 229, 255, 0.05), transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.05), transparent 50%);
        }

        .header {
            padding: 16px 20px;
            background: var(--header-bg); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100;
        }
        .header-left { display: flex; align-items: center; gap: 15px; }
        .btn-back {
            background: rgba(128,128,128,0.1); color: var(--text-main); border: 1px solid var(--card-border);
            width: 38px; height: 38px; border-radius: 50%; font-size: 20px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .header-title-box { display: flex; flex-direction: column; }
        .header-title { font-size: 18px; font-weight: 800; color: var(--neon-blue); letter-spacing: 0.5px; }
        .header-sub { font-size: 11px; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 1px; }

        .theme-toggle {
            background: rgba(128,128,128,0.1); border: 1px solid var(--card-border);
            width: 40px; height: 40px; border-radius: 12px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; font-size: 20px;
            transition: 0.3s;
        }

        .tabs-container {
            padding: 12px 16px; display: flex; gap: 10px; overflow-x: auto;
            scrollbar-width: none; border-bottom: 1px solid var(--card-border);
            background: var(--tab-bg); position: sticky; top: 70px; z-index: 99;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-btn {
            background: var(--card); border: 1.5px solid var(--card-border);
            padding: 10px 18px; border-radius: 20px; color: var(--text-sub);
            font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer;
            transition: all 0.25s; flex-shrink: 0;
        }
        .tab-btn.active {
            background: rgba(0, 229, 255, 0.1); border-color: var(--neon-blue);
            color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 229, 255, 0.1);
        }

        .q-container { flex: 1; overflow-y: auto; padding: 20px 16px 100px; scroll-behavior: smooth; }

        .q-card {
            background: var(--card); border: 1px solid var(--card-border);
            border-radius: 24px; padding: 20px; margin-bottom: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1); position: relative;
            overflow: hidden; opacity: 0; transform: translateY(20px);
            animation: slideUp 0.5s forwards;
        }
        .q-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-purple)); opacity: 0.5;
        }
        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        .q-header { display: flex;justify-content: space-between; align-items: center; margin-bottom: 14px; }
        .q-num {
            background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2);
            color: var(--neon-blue); padding: 4px 12px; border-radius: 8px;
            font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase;
        }
        .q-text { font-size: 16px; font-weight: 600; line-height: 1.6; margin-bottom: 20px; color: var(--text-main); }

        .opt-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(128,128,128,0.05); border: 1.5px solid var(--card-border);
            padding: 14px 16px; border-radius: 14px; color: var(--text-main);
            font-size: 14px; font-weight: 500; text-align: left; cursor: pointer;
            display: flex; gap: 12px; transition: all 0.2s; position: relative; overflow: hidden;
            font-family: inherit;
        }
        .opt-letter {
            width: 26px; height: 26px; border-radius: 6px; background: rgba(128,128,128,0.1);
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            font-weight: 800; color: var(--text-sub); flex-shrink: 0; transition: 0.3s;
        }
        
        .opt-btn.correct { background: rgba(16,185,129,0.1); border-color: var(--neon-green); }
        .opt-btn.correct .opt-letter { background: var(--neon-green); color: #fff; }
        .opt-btn.wrong   { background: rgba(239,68,68,0.1); border-color: var(--neon-red); }
        .opt-btn.wrong .opt-letter { background: var(--neon-red); color: #fff; }
        .opt-btn.locked { pointer-events: none; }

        .exp-toggle-btn {
            margin-top: 16px; background: rgba(168, 85, 247, 0.1); border: 1px solid rgba(168, 85, 247, 0.3);
            color: var(--neon-purple); padding: 12px; border-radius: 14px; width: 100%;
            font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
            cursor: pointer; display: none; align-items: center; justify-content: center; gap: 8px;
            transition: 0.3s; font-family: inherit;
        }
        .exp-box {
            margin-top: 12px; background: rgba(128, 128, 128, 0.05); border: 1px dashed var(--card-border);
            padding: 16px; border-radius: 14px; font-size: 13.5px; color: var(--text-sub);
            line-height: 1.6; display: none; animation: fadeInDown 0.3s forwards;
        }

        .bookmark-btn {
            background: rgba(128,128,128,0.1); border: 1px solid var(--card-border);
            color: var(--text-sub); width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; font-size: 14px;
        }
        .bookmark-btn.active {
            background: rgba(251, 191, 36, 0.1); border-color: #fbbf24;
            color: #fbbf24; box-shadow: 0 0 10px rgba(251, 191, 36, 0.2);
        }

        .bottom-fab {
            position: fixed; bottom: 30px; right: 20px;
            width: 56px; height: 56px; border-radius: 28px;
            background: var(--neon-blue); color: #fff;
            box-shadow: 0 4px 15px rgba(0, 229, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; border: none;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
        }
        .bottom-fab.filtering {
            background: #fbbf24;
            box-shadow: 0 4px 15px rgba(251, 191, 36, 0.4);
        }
        .bottom-fab:active { transform: scale(0.9); }
        .bottom-fab svg { width: 24px; height: 24px; fill: currentColor; }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-left">
            <button class="btn-back" onclick="history.back()">‹</button>
            <div class="header-title-box">
                <div class="header-title">NEET PYQ - Set 1</div>
                <div class="header-sub">50 Questions Per Subject</div>
            </div>
        </div>
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()">🌓</button>
    </div>
    <div class="tabs-container" id="tabsBox"></div>
    <div class="q-container" id="qContainer"></div>

    <button class="bottom-fab" id="bottomFab" onclick="toggleBookmarkFilter()" aria-label="Bookmarks">
        <svg viewBox="0 0 24 24" id="fabIcon">
            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
        </svg>
    </button>

<script>
    let PAPER_DATA = {
        Physics: [],
        Chemistry: [],
        Botany: [],
        Zoology: []
    };

    const SCRIPT_LETTERS = ['A', 'B', 'C', 'D'];
    let currentSubject = 'Physics';
    let showOnlyBookmarks = false;

    async function init() {
        // Load theme from localStorage
        const theme = localStorage.getItem('pyq-theme') || 'dark';
        if (theme === 'light') document.body.classList.add('light-theme');
        
        const container = document.getElementById('qContainer');
        container.innerHTML = '<div style="text-align:center; padding:40px; font-weight:600; color:var(--neon-blue)">Loading 200 Real NEET Questions... Please wait</div>';
        
        try {
            const files = ['Physics.json', 'Chemistry.json', 'Botany.json', 'Zoology.json'];
            for (let file of files) {
                let data;
                if (window.Android && typeof Android.readAsset === 'function') {
                    const jsonStr = Android.readAsset(file);
                    if (!jsonStr) throw new Error("Empty data from Android.readAsset");
                    data = JSON.parse(jsonStr);
                } else {
                    const res = await fetch('../' + file);
                    data = await res.json();
                }
                
                const subject = file.replace('.json', '');
                let collected = [];
                // Gather questions from quiz sets
                for (let set of data.quiz_sets) {
                    if (set.questions) {
                        collected = collected.concat(set.questions);
                    }
                }
                
                PAPER_DATA[subject] = collected.slice(0, 50).map((q, idx) => ({
                    cat: subject.toLowerCase(),
                    q: q.question,
                    opts: q.options,
                    ans: q.answer !== undefined ? q.answer : -1,
                    exp: q.explanation || "No detailed explanation provided for this question."
                }));
            }
        } catch (e) {
            console.error("PYQ Data Load Error:", e);
            container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--neon-red)">Error loading real MCQs. Please ensure JSON files are accessible.</div>';
            return;
        }
        
        renderTabs();
        renderQuestions(currentSubject);
    }

    // --- Bookmark System Logic ---
    function getBookmarks() {
        const raw = localStorage.getItem('neet_bookmarks');
        return raw ? JSON.parse(raw) : [];
    }

    function saveBookmarks(bms) {
        localStorage.setItem('neet_bookmarks', JSON.stringify(bms));
    }

    function toggleBookmark(sub, qIdx) {
        const q = PAPER_DATA[sub][qIdx];
        let bms = getBookmarks();
        const existingIdx = bms.findIndex(b => b.q === q.q);
        
        if (existingIdx > -1) {
            bms.splice(existingIdx, 1);
        } else {
            bms.push(q);
        }
        
        saveBookmarks(bms);
        renderQuestions(sub);
    }

    function toggleBookmarkFilter() {
        showOnlyBookmarks = !showOnlyBookmarks;
        const fab = document.getElementById('bottomFab');
        const icon = document.getElementById('fabIcon');
        
        if (showOnlyBookmarks) {
            fab.classList.add('filtering');
            icon.innerHTML = '<path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>'; // Close/X icon
        } else {
            fab.classList.remove('filtering');
            icon.innerHTML = '<path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>'; // Bookmark icon
        }
        
        renderQuestions(currentSubject);
    }
    // --- End Bookmark Logic ---

    function toggleTheme() {
        document.body.classList.toggle('light-theme');
        const isLight = document.body.classList.contains('light-theme');
        localStorage.setItem('pyq-theme', isLight ? 'light' : 'dark');
    }

    function renderTabs() {
        const box = document.getElementById('tabsBox');
        box.innerHTML = '';
        Object.keys(PAPER_DATA).forEach(sub => {
            const btn = document.createElement('button');
            btn.className = `tab-btn ${sub === currentSubject ? 'active' : ''}`;
            btn.textContent = sub;
            btn.onclick = () => {
                currentSubject = sub;
                renderTabs();
                renderQuestions(sub);
            };
            box.appendChild(btn);
        });
    }

    function renderQuestions(sub) {
        let data = PAPER_DATA[sub];
        const bookmarks = getBookmarks();
        
        if (showOnlyBookmarks) {
            data = data.filter(q => bookmarks.some(b => b.q === q.q));
        }

        const container = document.getElementById('qContainer');
        container.innerHTML = '';

        if (data.length === 0 && showOnlyBookmarks) {
            container.innerHTML = '<div style="text-align:center; padding:60px; color:var(--text-sub); font-weight:600">No bookmarks found in this subject.</div>';
            return;
        }

        data.forEach((qObj, index) => {
            // Find actual index in PAPER_DATA[sub] for bookmarking
            const realIdx = PAPER_DATA[sub].findIndex(q => q.q === qObj.q);
            const isBookmarked = bookmarks.some(b => b.q === qObj.q);

            const card = document.createElement('div');
            card.className = 'q-card';
            card.style.animationDelay = `${index * 0.05}s`;

            let optsHtml = '';
            qObj.opts.forEach((opt, oIndex) => {
                optsHtml += `
                    <button class="opt-btn" onclick="checkAnswer(this, ${oIndex}, ${qObj.ans}, 'exp-btn-${index}', 'exp-box-${index}')">
                        <div class="opt-letter">${SCRIPT_LETTERS[oIndex]}</div>
                        <div>${opt}</div>
                    </button>
                `;
            });

            card.innerHTML = `
                <div class="q-header">
                    <div class="q-num">Q ${realIdx + 1}</div>
                    <button class="bookmark-btn ${isBookmarked ? 'active' : ''}" onclick="toggleBookmark('${sub}', ${realIdx})">
                        ${isBookmarked ? '⭐' : '☆'}
                    </button>
                </div>
                <div class="q-text">${qObj.q}</div>
                <div class="opt-grid">${optsHtml}</div>
                <button class="exp-toggle-btn" id="exp-btn-${index}" onclick="toggleExp('exp-box-${index}')">
                    &#128161; View Solution
                </button>
                <div class="exp-box" id="exp-box-${index}">
                    <strong>Explanation:</strong><br>${qObj.exp}
                </div>
            `;
            container.appendChild(card);
        });
    }

    function checkAnswer(btn, clickedOpt, correctOpt, expBtnId, expBoxId) {
        const grid = btn.parentElement;
        grid.querySelectorAll('.opt-btn').forEach((b, idx) => {
            b.classList.add('locked');
            if (idx === correctOpt) b.classList.add('correct');
        });
        if (clickedOpt !== correctOpt) btn.classList.add('wrong');
        document.getElementById(expBtnId).style.display = 'flex';
        document.getElementById(expBoxId).style.display = 'block';
    }

    function toggleExp(id) {
        const el = document.getElementById(id);
        el.style.display = el.style.display === 'none' ? 'block' : 'none';
    }

    window.onload = init;
</script>
</body>
</html>
